name: 功能建议
description: 想要的新能力或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        这个项目的定位是让老式 A2DP 蓝牙音箱继续可用，不是做 AirPlay。
        建议如果偏离这个定位，可能不会被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景，再说功能。
      placeholder: 我有 4 台音箱，但第 4 台只能通过 iPhone 桥接，切换很麻烦。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法

  - type: input
    id: devices
    attributes:
      label: 你的设备情况
      description: Mac 型号、音箱型号和数量，帮助判断可行性。
